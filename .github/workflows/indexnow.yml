name: IndexNow

on:
  schedule:
    # todo dia às 03:20 UTC
    - cron: '20 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build:fast
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Publicar a chave do IndexNow na raiz do site
        run: |
          if [ -n "$INDEXNOW_KEY" ]; then
            echo "$INDEXNOW_KEY" > "public/$INDEXNOW_KEY.txt"
            echo "chave publicada"
          else
            echo "sem chave configurada — nada a publicar"
          fi
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Enviar URLs ao IndexNow
        run: node scripts/indexnow.js
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
